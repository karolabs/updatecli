# GitHub Actions workflow, for running configurable automated processes.
# See https://docs.github.com/actions for more information.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

# Example Updatecli workflow,
# for calling karolabs Updatecli policies from any karo-custom repo.

# TEST WORKFLOW

---

name: Updatecli (test)

on:
  # manual trigger
  workflow_dispatch:
  # once per day
  # schedule:
  #   - cron: "0 0 * * *"
  #     timezone: "Europe/London"

jobs:

  call-updatecli-images:
    name: Updatecli Images
    # external workflow file
    uses: karolabs/updatecli/.github/workflows/updatecli-images.yml@dev

    # set permissions
    permissions:
      contents: write
      pull-requests: write

    # define images
    strategy:
      fail-fast: false
      matrix:
        image:
          - whoami
          - cetusguard
          - pocketid
          - traefik
        include:
          - image: traefik
            registry: dhi.io

    # pass variables and secrets
    with:
      docker-image: ${{ matrix.image }}
      docker-registry: ${{ matrix.registry }}
      github-branch: dev
      github-pr-label: Kind/Update
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
