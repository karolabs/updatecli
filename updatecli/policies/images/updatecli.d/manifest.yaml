# Manifest file for `updatecli`, a declarative update policy engine.
# See https://updatecli.io for more information.
# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json

name: 'Update {{ .image.repository }} image tag'
pipelineid: 'images-{{ requiredEnv "UPDATECLI_IMAGE_NAME" }}' # pr branch name

sources:
  # https://updatecli.io/docs/plugins/resource/docker_image
  dockerImageTag:
    name: Filter newest image tag
    kind: dockerimage
    spec:
      image: '{{ .image.repository }}'
      versionfilter:
        kind: regex/semver
        regex: '{{ .image.tag_regex }}'
        pattern: '{{ .image.semver.pattern }}'
        #{{- if .image.semver.strict }}
        strict: true
        #{{- end }}

  # https://updatecli.io/docs/plugins/resource/docker_digest
  dockerDigest:
    name: Resolve image tag digest
    kind: dockerdigest
    spec:
      image: '{{ .image.repository }}'
      tag: '{{ source "dockerImageTag" }}'

targets:
  # https://updatecli.io/docs/plugins/resource/yaml
  imagesFile:
    name: 'bump {{ requiredEnv "UPDATECLI_IMAGE_NAME" }} image tag to {{ source "dockerImageTag" }}' # commit title
    kind: yaml
    sourceid: dockerDigest
    scmid: default
    transformers:
      - addprefix: '{{ .image.repository }}:'
    spec:
      file: compose/images.yml
      # use variable '<username>_<image name>_image'
      key: '$.{{ requiredEnv "UPDATECLI_GITHUB_REPOSITORY_OWNER" }}_{{ requiredEnv "UPDATECLI_IMAGE_NAME" }}_image'

scms:
  # https://updatecli.io/docs/plugins/scm/github
  default:
    kind: github
    spec:
      owner: '{{ requiredEnv "UPDATECLI_GITHUB_REPOSITORY_OWNER" }}'
      repository: '{{ requiredEnv "UPDATECLI_GITHUB_REPOSITORY_NAME" }}'
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      username: '{{ requiredEnv "UPDATECLI_GITHUB_ACTOR" }}'
      branch: '{{ requiredEnv "UPDATECLI_GITHUB_BRANCH" }}'
      commitmessage:
        hidecredit: true
        body: |
          Commit generated by Updatecli.
      commitusingapi: true # signed commits
      force: false
      workingbranchseparator: '-'

actions:
  # https://updatecli.io/docs/plugins/actions/github
  pullRequest:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'Update {{ .image.repository }} to {{ source "dockerImageTag" }}'
      labels:
        - '{{ requiredEnv "UPDATECLI_GITHUB_PR_LABEL" }}'
      description: '{{ .image.pr_markdown }}'
